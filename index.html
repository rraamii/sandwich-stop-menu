<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sandwich Stop Menu</title>
<style>
 body {
   font-family: Arial, sans-serif;
   margin: 0;
   padding: 0;
   background: #111;
   color: #fff;
 }
 header {
   background: #d32f2f;
   padding: 40px 20px;
   text-align: center;
   background-image: url('LOGO.jpg');
   background-size: 150px;
   background-repeat: no-repeat;
   background-position: center 10px;
 }
 header h1 {
   margin-top: 180px;
   font-size: 42px;
   font-weight: bold;
 }
 .menu-section {
   padding: 40px 20px;
 }
 .menu-title {
   font-size: 32px;
   font-weight: bold;
   margin-bottom: 20px;
   color: #ffcc00;
 }
 .grid {
   display: grid;
   grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
   gap: 20px;
 }
 .item-card {
   background: #1a1a1a;
   padding: 20px;
   border-radius: 12px;
   border: 1px solid #333;
   box-shadow: 0 0 10px rgba(0,0,0,0.4);
   transition: 0.3s;
 }
 .item-card:hover {
   transform: scale(1.03);
   border-color: #ffcc00;
 }
 .price {
   font-size: 20px;
   font-weight: bold;
   color: #ffcc00;
   margin-top: 10px;
 }
 .item-name {
   font-size: 20px;
   font-weight: bold;
 }
 </style>
</head>
<body>
<header>
  <img src="LOGO.jpg" class="logo" alt="Sandwich Stop Logo" />
  <h1>Sandwich Stop</h1>
</header>

<!-- Main Container -->
<div class="container">

  <!-- Hot Subs Section -->
  <div class="menu-section">
    <h2 class="menu-title">الساندويشات الساخنة</h2>
    <div class="grid">
      <div class="item-card"><img src="https://i.imgur.com/rbxYJjS.png" class="item-img"/><div class="item-name">ساندويش الخضار المشوية</div><div class="price">15₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/rbxYJjS.png" class="item-img"/><div class="item-name">دجاج بارجيوت</div><div class="price">22₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/rbxYJjS.png" class="item-img"/><div class="item-name">ساندويش جريل دجاج</div><div class="price">22₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/rbxYJjS.png" class="item-img"/><div class="item-name">ستوروفراي</div><div class="price">24₪</div></div>
    </div>
  </div>

  <!-- Steak Section -->
  <div class="menu-section">
    <h2 class="menu-title">اللحمة</h2>
    <div class="grid">
      <div class="item-card"><img src="https://i.imgur.com/7yW8Gd6.png" class="item-img"/><div class="item-name">ستيك بالجبن</div><div class="price">33₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/7yW8Gd6.png" class="item-img"/><div class="item-name">ستيك بالبصل</div><div class="price">34₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/7yW8Gd6.png" class="item-img"/><div class="item-name">ستيك بالفليفلة</div><div class="price">34₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/7yW8Gd6.png" class="item-img"/><div class="item-name">ستيك بالفطر</div><div class="price">35₪</div></div>
    </div>
  </div>

  <!-- Crispy Chicken Section -->
  <div class="menu-section">
    <h2 class="menu-title">الدجاج الكريسبي</h2>
    <div class="grid">
      <div class="item-card"><img src="https://i.imgur.com/G5XQ8qC.png" class="item-img"/><div class="item-name">دجاج كريسبي</div><div class="price">22₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/G5XQ8qC.png" class="item-img"/><div class="item-name">بفلو</div><div class="price">22₪</div></div>
      <div class="item-card"><img src="https://i.imgur.com/G5XQ8qC.png" class="item-img"/><div class="item-name">باربيكيو</div><div class="price">22₪</div></div>
    </div>
  </div>

</div>
</body>
</html>
